x-isolated-task: &isolated-task
  profiles: [tools]
  network_mode: none
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  mem_limit: 512m

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attribution}
      POSTGRES_USER: ${POSTGRES_USER:-attribution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attribution-local}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    container_name: clickhouse
    restart: unless-stopped

    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"

    environment:
      CLICKHOUSE_DB: test_db
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: "admin123"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --host 127.0.0.1 --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}" --database "$${CLICKHOUSE_DB}"
          --query "SELECT 1" >/dev/null
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  sandbox:
    <<: *isolated-task
    image: "${SANDBOX_IMAGE:-attribution-sandbox:local}"
    build:
      context: ..
      dockerfile: docker/sandbox.Dockerfile
    read_only: true
    memswap_limit: 512m
    pids_limit: 24
    cpus: 1

  report:
    <<: *isolated-task
    image: "${REPORT_IMAGE:-attribution-report:local}"
    build:
      context: ..
      dockerfile: docker/report.Dockerfile

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
